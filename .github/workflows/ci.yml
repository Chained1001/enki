name: ci

on:
  # 默认分支是 master；main 保留给将来改名，两者都触发（P0-1）
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # 本仓库零依赖，没有 package-lock.json，所以不跑 npm ci，也不开 cache。
      # 照抄官方 Node 模板加 cache: 'npm' 会因找不到锁文件而失败。
      - name: 静态校验 skills/
        run: npm run validate
      - name: 运行测试
        run: npm test
